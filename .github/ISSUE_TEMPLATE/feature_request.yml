name: "Feature request"
description: Improve the application by adding a new feature or enhancing an existing one.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to submit a feature request! Please fill out the following template to help us understand your request better. The more details you provide, the easier it will be for us to evaluate and implement your suggestion.

  - type: textarea
    id: description
    attributes:
      label: What should change?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the situation you ran into, not only the solution you have in mind.
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Affected area
      placeholder: CLI, or other area of the project
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      description: By submitting this issue, you agree to follow our [contributing guide](https://github.com/mmaachado/template/blob/master/.github/CONTRIBUTING.md).
      options:
        - label: I have searched the existing issues
          required: true
