[project]
authors = [{ name = "Marcelo Machado", email = "uniqueduckinbox@duck.com" }]
name = "template"
dynamic = ["version"]
description = "public repository template"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["python", "template", "repository", "claude"]

dependencies = []

[project.urls]
Homepage = "https://github.com/mmaachado/template"
Issues = "https://github.com/mmaachado/template/issues"

[tool.black]
line-length = 79

[tool.ruff.lint]
select = [
    'E',
    'W',
    'F',
    'I',
    'UP',
    'B',
    'C4',
    'C90',
    'SIM',
    'PT',
    'ANN',
    'S',
    'D',
    'RUF',
]

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['S101', 'D']

[tool.mypy]
python_version = '3.11'
strict = true
files = ['src']

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ['src']
branch = true

[tool.taskipy.tasks]
lint = 'ruff check .'
format = 'black format .'
typecheck = 'mypy src'
pre_test = 'task lint'
test = 'pytest -s -x --cov=src -vv'
post_test = 'coverage html'

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ignr>=2.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
    "taskipy>=1.14",
]
